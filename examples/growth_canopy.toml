# growforge example: a grown table canopy.
#
# Units everywhere: millimetres, newtons, MPa (N/mm^2), N*mm for torque,
# g/cm^3 for mass density and mm/s^2 for gravity.
#
# A 200 x 200 mm tabletop carrying 600 N spread over its whole surface, standing
# on four small feet, with a 60 mm service column through the middle that nothing
# may grow into. x and y span the top, z is up.
#
# This is the growth engine rather than SIMP: it routes a load path from the top
# down to each foot, hangs an organic canopy of branches off those legs that
# grows *into* the tabletop and fuses to it, prunes anything that still ends on
# nothing, thickens what is left by the load it carries and rasterizes the
# result. It takes seconds instead of the tens of minutes an equivalent SIMP run
# would, and the von Mises table printed at the end is what says whether the
# heuristic did well on this problem - read it before printing.
#
#   growforge check examples/growth_canopy.toml
#   growforge run   examples/growth_canopy.toml
#   growforge run   examples/growth_canopy.toml --view

[project]
name = "growth_canopy"
engine = "growth"

[resolution]
# 4 mm voxels give a 50 x 50 x 30 element grid.
voxel_size_mm = 4.0

[material]
preset = "petg"

[optimization]
# Both of these are read by the growth engine as well: mass_fraction is the
# volume target the strut radii are normalized against, and min_feature_mm is
# the smallest strut *diameter*, so no branch comes out thinner than 12 mm.
mass_fraction = 0.12
min_feature_mm = 12.0

[growth]
# Every key is optional. Only the ones this design actually wants to pin are
# here; the rest, including the kill and attraction radii, default to values
# derived from min_feature_mm and mass_fraction (see the README).
seed = 11396317718348371989          # any u64; the same seed regrows the same STL
attractor_per_cm3 = 5.0              # attraction points per cm3 of design domain
murray_exponent = 2.6                # r_parent^n = sum(r_child^n)
max_radius_mm = 27.0                 # cap on a single strut radius, 36 mm by default
max_steps = 400                      # cap on space colonization iterations
prune = true                         # the default: branches that end on nothing
                                     # carry no load, cannot be printed without
                                     # support under them and read as an
                                     # unfinished model, so they are removed.
                                     # false keeps them as decoration

[output]
# Relative paths resolve against the directory holding this file.
stl_path = "growth_canopy.stl"
iso_level = 0.5
smoothing_iterations = 8
# Seal anything the branches happen to enclose, so the result is printable
# without trapped support.
voids = "fill"
# Machine readable copy of the von Mises table printed at the end of the run.
stress_json = "growth_canopy_stress.json"

# Design domain: everything under and including the tabletop.
[[domain]]
op = "add"
shape = "box"
min = [0.0, 0.0, 0.0]
max = [200.0, 200.0, 120.0]

# The tabletop itself: forced solid, so the distributed load always has a surface
# to push on and the branches have something to grow into.
[[keepin]]
shape = "box"
min = [0.0, 0.0, 111.0]
max = [200.0, 200.0, 120.0]

# A service column through the middle of the table. Nothing may grow into it, so
# the canopy has to route around it - which is the whole point of showing it.
[[keepout]]
shape = "cylinder"
p1 = [100.0, 100.0, -5.0]
p2 = [100.0, 100.0, 108.0]
radius = 30.0

# Four feet on the floor, one at each corner.
[[supports]]
region = { shape = "box", min = [-1.0, -1.0, -1.0], max = [26.0, 26.0, 1.0] }

[[supports]]
region = { shape = "box", min = [174.0, -1.0, -1.0], max = [201.0, 26.0, 1.0] }

[[supports]]
region = { shape = "box", min = [-1.0, 174.0, -1.0], max = [26.0, 201.0, 1.0] }

[[supports]]
region = { shape = "box", min = [174.0, 174.0, -1.0], max = [201.0, 201.0, 1.0] }

[[loadcases]]
name = "tabletop"
weight = 1.0

  # 600 N spread evenly over the whole top surface.
  [[loadcases.loads]]
  type = "force"
  region = { shape = "box", min = [-1.0, -1.0, 118.0], max = [201.0, 201.0, 121.0] }
  vector = [0.0, 0.0, -600.0]

  # The table's own weight, in the same load case as the tabletop load.
  [[loadcases.loads]]
  type = "gravity"
  direction = [0.0, 0.0, -1.0]
  g_mm_s2 = 9810.0
